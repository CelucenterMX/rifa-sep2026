name: Rifa Bot — Monitor Tarea

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar horario (solo 16-Sep hasta 10pm México)
        id: horario
        run: |
          HOUR=$(TZ='America/Mexico_City' date +%H)
          DATE=$(TZ='America/Mexico_City' date +%Y-%m-%d)
          echo "hora=$HOUR | fecha=$DATE"
          if [ "$DATE" = "2026-09-16" ] && [ "$HOUR" -lt 22 ]; then
            echo "activo=true" >> $GITHUB_OUTPUT
          else
            echo "activo=false" >> $GITHUB_OUTPUT
            echo "Fuera de horario, no se ejecuta."
          fi

      - name: Monitor y procesar palabras clave
        if: steps.horario.outputs.activo == 'true'
        env:
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
          KREIS_WEBHOOK: ${{ secrets.KREIS_WEBHOOK }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request, urllib.parse

          BITRIX    = os.environ['BITRIX_WEBHOOK'].rstrip('/')
          KREIS     = os.environ.get('KREIS_WEBHOOK', os.environ['BITRIX_WEBHOOK']).rstrip('/')
          TASK_ID   = 205289
          CHAT_ID   = 'chat172513'   # Chat interno de la tarea 205289
          RIFA_LINK = 'https://celucentermx.github.io/rifa-sep2026/'

          KEYWORDS = [
            'enterado', 'enterada',
            'listo', 'lista',
            'boleto', 'boleta',
            'salir', 'sale',
            'no tengo boletos', 'no tengo boleto',
          ]

          def api(webhook, method, params=None):
            url  = f"{webhook}/{method}"
            data = urllib.parse.urlencode(params or {}, doseq=True).encode()
            req  = urllib.request.Request(url, data=data)
            with urllib.request.urlopen(req, timeout=15) as r:
              return json.loads(r.read())

          # 1. Obtener lista actual de accomplices (participantes) de la tarea
          tdata       = api(BITRIX, 'tasks.task.get', {'taskId': TASK_ID})
          accomplices = [str(u) for u in tdata.get('result', {}).get('task', {}).get('accomplices', [])]
          print(f"Participantes actuales en tarea: {len(accomplices)} → {accomplices}")

          # 2. Leer mensajes del chat de la tarea
          mdata    = api(BITRIX, 'im.dialog.messages.get', {'DIALOG_ID': CHAT_ID, 'LIMIT': 100})
          messages = mdata.get('result', {}).get('messages', [])
          print(f"Mensajes en chat de tarea: {len(messages)}")

          # 3. Procesar cada mensaje con keyword de usuarios aún en la tarea
          for msg in messages:
            author_id = str(msg.get('author_id', '0'))
            text      = msg.get('text', '').strip().lower()

            if author_id == '0' or not text:
              continue

            # Solo si todavía está como participante (evita reprocesar)
            if author_id not in accomplices:
              continue

            # Verificar keyword
            if not any(kw in text for kw in KEYWORDS):
              continue

            print(f"\n✅ Keyword '{text}' — usuario {author_id}")

            # Obtener nombre
            try:
              udata  = api(BITRIX, 'user.get', {'ID': author_id})
              users  = udata.get('result', [])
              nombre = users[0].get('NAME', 'Gerente') if users else 'Gerente'
            except:
              nombre = 'Gerente'

            # Remover de la tarea
            try:
              new_acc = [u for u in accomplices if u != author_id]
              params  = {'taskId': TASK_ID}
              for i, uid in enumerate(new_acc):
                params[f'fields[ACCOMPLICES][{i}]'] = uid
              if not new_acc:
                params['fields[ACCOMPLICES]'] = ''
              api(BITRIX, 'tasks.task.update', params)
              accomplices = new_acc  # actualizar lista local
              print(f"🗑️  {nombre} removido/a de la tarea")
            except Exception as e:
              print(f"⚠️  Error removiendo de tarea: {e}")

            # DM desde Kreis Bot
            try:
              msg_text = (
                f"¡Hola {nombre}! 🎟️\n\n"
                f"Gracias por confirmar. Aquí está el link de registro de la rifa de septiembre:\n\n"
                f"👉 {RIFA_LINK}\n\n"
                f"Entra y busca TU nombre para ver los números de boleto que te tocaron.\n\n"
                f"━━━━━━━━━━━━━━━━━━━━\n"
                f"📢 IMPORTANTE — Comparte este link con tu equipo:\n"
                f"Por favor reenvía este link a tus compañeros y apoyos de tienda "
                f"para que cada uno pueda ver sus boletos. Ellos también deben entrar "
                f"y buscar su propio nombre.\n"
                f"━━━━━━━━━━━━━━━━━━━━\n\n"
                f"⚠️ Cada quien debe elegir su propio nombre, no el de otra persona. "
                f"Si alguien elige el nombre equivocado, avísanos y lo corregimos.\n\n"
                f"¡Mucha suerte en el sorteo! 🎉"
              )
              api(KREIS, 'im.message.add', {'DIALOG_ID': author_id, 'MESSAGE': msg_text})
              print(f"📨 DM enviado a {nombre} (ID {author_id})")
            except Exception as e:
              print(f"⚠️  Error enviando DM: {e}")

          print("\n✔️  Ciclo completo")
          EOF
